name: API Build Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/api-build-deploy.yaml'

jobs:
  build-job:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: generate-tag
        run: |
          TAG=$(date +'%Y.%m.%d').${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Les tests tournent sur SQLite en memoire : aucune base n'est requise ici.
      # - name: Run tests
      #   working-directory: backend
      #   run: dotnet test --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-api:${{ steps.generate-tag.outputs.tag }}
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  migrate-job:
    name: Apply EF Core migrations
    runs-on: ubuntu-latest
    needs: build-job
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore local tools (dotnet-ef)
        working-directory: backend
        run: dotnet tool restore

      # N'applique que les migrations EN ATTENTE, et s'arrete a la premiere erreur : une
      # migration en echec bloque donc le deploiement.
      #
      # Prerequis : le secret MIGRATIONS_DB_CONNECTION, et une base qui accepte les
      # connexions du runner GitHub (pare-feu Azure SQL : "Autoriser les services Azure").
      #
      # Aucun baseline n'est necessaire sur une base vide : InitialCreate cree les tables,
      # les migrations suivantes les font evoluer. db/baseline.sql ne concerne que la base
      # locale, dont les tables preexistaient a EF Core.
      - name: Apply database migrations
        working-directory: backend
        env:
          TOURNOI_MIGRATIONS_CONNECTION: ${{ secrets.MIGRATIONS_DB_CONNECTION }}
        run: |
          dotnet ef database update \
            --project src/TournoiArchipelago.Api \
            --startup-project src/TournoiArchipelago.Api

