name: Web Build Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/web-build-deploy.yaml'

jobs:
  build-job:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: generate-tag
        run: |
          TAG=$(date +'%Y.%m.%d').${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ steps.generate-tag.outputs.tag }}
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy-job:
    name: Deploy Web to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # L'ingress de Container Apps route par en-tete Host. nginx envoie l'hote de son amont
      # ($proxy_host), il faut donc que API_URL porte exactement le FQDN de l'API : un nom
      # court ou un hote etranger fait rendre une page "Container App - Unavailable" en 404.
      #
      # Le FQDN est lu ici plutot qu'ecrit en dur : il contient le suffixe unique de
      # l'environnement, et differe selon que l'entree de l'API est interne ou externe.
      - name: Resolve API address
        id: api
        run: |
          FQDN=$(az containerapp show \
            --name archipelago-api \
            --resource-group archipelago \
            --query properties.configuration.ingress.fqdn -o tsv)

          if [ -z "$FQDN" ]; then
            echo "L'API n'a pas d'ingress : impossible de determiner son adresse." >&2
            exit 1
          fi

          echo "url=https://$FQDN" >> $GITHUB_OUTPUT
          echo "API joignable a https://$FQDN"

      - name: Deploy revision
        run: |
          az containerapp update \
            --name archipelago-web \
            --resource-group archipelago \
            --image "${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ needs.build-job.outputs.image-tag }}" \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars API_URL=${{ steps.api.outputs.url }}

      - name: Report endpoint
        run: |
          az containerapp show \
            --name archipelago-web \
            --resource-group archipelago \
            --query "{revision:properties.latestRevisionName, adresse:properties.configuration.ingress.fqdn}" -o table
