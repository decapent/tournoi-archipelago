name: Web Build Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/web-build-deploy.yaml'

jobs:
  build-job:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: generate-tag
        run: |
          TAG=$(date +'%Y.%m.%d').${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ steps.generate-tag.outputs.tag }}
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy-job:
    name: Deploy Web to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # API_URL est l'amont du proxy nginx. Les deux applications partagent le meme
      # environnement Container Apps : le nom court suffit, la resolution est interne et le
      # trafic ne sort jamais sur Internet. L'entree interne de l'API ecoute sur le port 80
      # et redirige vers le 8080 du conteneur, d'ou l'absence de port ici.
      - name: Deploy revision
        run: |
          az containerapp update \
            --name archipelago-web \
            --resource-group archipelago \
            --image "${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ needs.build-job.outputs.image-tag }}" \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars API_URL=http://archipelago-api

      - name: Report endpoint
        run: |
          az containerapp show \
            --name archipelago-web \
            --resource-group archipelago \
            --query "{revision:properties.latestRevisionName, adresse:properties.configuration.ingress.fqdn}" -o table
