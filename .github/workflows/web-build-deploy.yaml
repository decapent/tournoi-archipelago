name: Web Build Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/web-build-deploy.yaml'

jobs:
  build-job:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: generate-tag
        run: |
          TAG=$(date +'%Y.%m.%d').${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ steps.generate-tag.outputs.tag }}
            ${{ vars.CONTAINER_REGISTRY }}/archipelago-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy-job:
    name: Deploy Web to Azure Container Instances
    runs-on: ubuntu-latest
    needs: build-job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACI ne sait pas changer l'image d'un groupe en place : on supprime puis on recree.
      - name: Remove previous container group
        run: |
          az container delete \
            --resource-group archipelago \
            --name archipelago-web \
            --yes || true

      # API_URL est l'amont du proxy nginx, substitue au demarrage du conteneur. Les deux
      # groupes etant distincts, il s'agit du FQDN public de l'API, port compris.
      - name: Create container group
        run: |
          az container create \
            --resource-group archipelago \
            --name archipelago-web \
            --image "${{ vars.CONTAINER_REGISTRY }}/archipelago-web:${{ needs.build-job.outputs.image-tag }}" \
            --registry-login-server ${{ vars.CONTAINER_REGISTRY }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label ${{ vars.WEB_DNS_LABEL }} \
            --ports 80 \
            --os-type Linux \
            --cpu 1 --memory 1 \
            --restart-policy Always \
            --environment-variables API_URL="${{ vars.API_URL }}"

      - name: Report endpoint
        run: |
          az container show \
            --resource-group archipelago \
            --name archipelago-web \
            --query "{fqdn:ipAddress.fqdn, etat:instanceView.state}" -o table
